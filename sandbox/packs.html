<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>product pack preview — image→lottie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237fb3d5'/%3E%3Cpath d='M13 10l9 6-9 6z' fill='%23131517'/%3E%3C/svg%3E">

<style>
:root {
  --bg: #1e2023;
  --panel: #26282c;
  --line: #3a3d42;
  --ink: #d7d9dc;
  --dim: #949aa1;
  --dimmer: #6d7278;
  --accent: #7faac7;
  --ok: #7fa88a;
  --warn: #c2a96b;
  --bad: #bc7f7f;
  --stage: 256px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 13px/1.5 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* top bar */
#topbar {
  position: sticky; top: 0; z-index: 5;
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
}
#topbar h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
#topbar a.nav { color: var(--dim); font-size: 12px; border-left: 1px solid var(--line); padding-left: 14px; }
#topbar a.nav:hover { color: var(--ink); }
#topbar label { display: flex; gap: 5px; align-items: center; color: var(--dim); cursor: pointer; }
#topbar select, #topbar button {
  background: #1c1e20; color: var(--ink); border: 1px solid var(--line);
  border-radius: 3px; font: inherit; font-size: 11.5px; padding: 4px 8px; cursor: pointer;
}
.spacer { flex: 1; }
#stamp {
  color: var(--dimmer); font-size: 11px; font-family: ui-monospace, Menlo, monospace;
}

/* mascot header */
#mascot { text-align: center; padding: 18px 18px 0; }
#mascot img {
  width: 128px; height: 128px; border-radius: 8px; border: 1px solid var(--line);
  background: #1c1e20; object-fit: contain;
}
#mascot h2 { font-size: 15px; font-weight: 500; margin: 8px 0 2px; }
#mascot .sub { color: var(--dim); font-size: 12px; }

/* cards grid */
#grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(580px, 1fr));
  gap: 14px; padding: 18px;
}
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 12px; display: flex; flex-direction: column; gap: 10px;
}
.card h3 {
  font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center;
}
.card h3 .badge {
  font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  padding: 1px 6px; border-radius: 3px;
}
.badge.pass { background: #2a4231; color: var(--ok); }
.badge.fail { background: #4a3030; color: var(--bad); }
.badge.warn { background: #3f3a28; color: var(--warn); }
.badge.dry { background: #2a3440; color: var(--accent); }

/* side-by-side panes */
.panes { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.panes figure { margin: 0; }
.panes figcaption {
  font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--dimmer); margin-top: 4px; text-align: center;
}
.stage {
  width: var(--stage); height: var(--stage); border-radius: 4px; overflow: hidden;
  background-color: #f0f0f0;
  background-image:
    linear-gradient(45deg, #c8c8c8 25%, transparent 25%, transparent 75%, #c8c8c8 75%),
    linear-gradient(45deg, #c8c8c8 25%, transparent 25%, transparent 75%, #c8c8c8 75%);
  background-size: calc(var(--stage) / 16) calc(var(--stage) / 16);
  background-position: 0 0, calc(var(--stage) / 32) calc(var(--stage) / 32);
}
.stage img, .stage canvas, .stage svg { width: 100%; height: 100%; display: block; }

/* per-card controls */
.ctls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ctls button {
  background: #1c1e20; color: var(--ink); border: 1px solid var(--line);
  border-radius: 3px; font: inherit; font-size: 11px; padding: 3px 7px; cursor: pointer;
}
.ctls button.on { border-color: var(--accent); color: var(--accent); }
.ctls select {
  background: #1c1e20; color: var(--ink); border: 1px solid var(--line);
  border-radius: 3px; font: inherit; font-size: 11px; padding: 3px 4px; cursor: pointer;
}
.ctls input[type=range] { flex: 1; min-width: 80px; accent-color: var(--accent); }
.ctls .fr {
  color: var(--dimmer); font-family: ui-monospace, Menlo, monospace; font-size: 10.5px;
  min-width: 5em; text-align: right;
}
.ctls .size {
  color: var(--dimmer); font-size: 10.5px; margin-left: 4px;
  font-family: ui-monospace, Menlo, monospace;
}

/* gate chips */
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  font-family: ui-monospace, Menlo, monospace; font-size: 10.5px;
  border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; color: var(--dim);
}
.chip i { font-style: normal; color: var(--dimmer); }
.chip.ok { border-color: #3f5a48; color: var(--ok); }
.chip.warn { border-color: #5c5233; color: var(--warn); }
.chip.bad { border-color: #5e3b3b; color: var(--bad); }

/* meta row */
.meta { display: flex; gap: 10px; font-size: 11px; color: var(--dim); flex-wrap: wrap; }
.meta a { font-size: 10.5px; }
.meta .sep { color: var(--line); }

#loading { text-align: center; padding: 40px; color: var(--dim); }

/* zoom lightbox */
#box {
  position: fixed; inset: 0; background: #14151799; backdrop-filter: blur(3px);
  display: none; align-items: center; justify-content: center; z-index: 9; cursor: zoom-out;
}
#box.on { display: flex; }
#box img { max-width: 96vw; max-height: 94vh; border-radius: 4px; }
</style>

<div id="topbar">
  <h1>product pack preview</h1>
  <a href="/" class="nav">appraisal sandbox</a>
  <span class="spacer"></span>
  <label>display <select id="globalscale">
    <option value="128">128 px — sticker</option>
    <option value="256" selected>256 px — chat</option>
    <option value="512">512 px — hero</option>
  </select></label>
  <label><input type="checkbox" id="globalloop"> loop all</label>
  <button id="globalplay">pause all</button>
  <select id="packsel" hidden></select>
  <span id="stamp"></span>
</div>

<div id="mascot"></div>
<div id="grid"></div>
<div id="loading">loading pack data…</div>
<div id="box"><img alt=""></div>

<script src="/vendor/lottie.min.js"></script>

<script>
document.getElementById("loading").textContent = "scripts loaded…";
window.onerror = function(msg, url, line) {
  document.getElementById("loading").textContent = "JS error: " + msg + " (line " + line + ")";
};
</script>

<script>
(function() {
var loadingEl = document.getElementById("loading");
function show(msg) { loadingEl.textContent = msg; loadingEl.hidden = false; }
function hideLoading() { loadingEl.hidden = true; }

var $ = function(s) { return document.querySelector(s); };
var el = function(tag, cls, txt) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};

function num(v, d) {
  return (v == null || isNaN(v)) ? null : Number(v).toFixed(d);
}
function grade(v, good, bad, inv) {
  if (v == null || isNaN(v)) return "";
  return inv
    ? (v <= good ? "ok" : v <= bad ? "warn" : "bad")
    : (v >= good ? "ok" : v >= bad ? "warn" : "bad");
}
function chip(label, value, cls) {
  var c = el("span", "chip " + (cls || ""));
  c.appendChild(el("i", null, label + " "));
  c.appendChild(document.createTextNode(value));
  return c;
}
function fmtBytes(b) {
  if (b == null) return "?";
  return b < 1024 * 1000 ? (b / 1024).toFixed(0) + " KB" : (b / 1048576).toFixed(1) + " MB";
}

var manifest = null, sig = null;
var players = {};       // name -> { anim, scrubbing }

function verlabel(clip) {
  var v = clip.gates && clip.gates.verdict;
  if (!v) return "";
  if (v === "PASS") return "pass";
  if (v === "FAIL" || v === "REJECT") return "fail";
  if (v === "FLAG") return "warn";
  return "warn";
}

function pickLottie(variants) {
  if (!variants || !variants.length) return null;
  var have = variants.map(function(v) { return v.rung; });
  var pref = ["512webp-q65-24", "512webp", "256webp", "512q", "raw"];
  for (var i = 0; i < pref.length; i++) {
    var hit = have.find(function(r) { return r.startsWith(pref[i]); });
    if (hit) return variants.find(function(v) { return v.rung === hit; });
  }
  return variants[variants.length - 1];
}

function buildCard(clip) {
  var card = el("div", "card");

  var h3 = el("h3");
  h3.appendChild(document.createTextNode(clip.name));
  var vl = verlabel(clip);
  if (vl) {
    var b = el("span", "badge " + vl);
    b.textContent = (clip.gates && clip.gates.verdict) || clip.emote_status || "";
    h3.appendChild(b);
  }
  card.appendChild(h3);

  var panes = el("div", "panes");

  var gifFig = el("figure");
  var gifStage = el("div", "stage");
  var gifImg = el("img");
  gifImg.src = clip.gif || "";
  gifImg.alt = clip.name + " GIF";
  gifImg.style.cursor = "zoom-in";
  (function(sheet, gif) {
    gifImg.onclick = function() { zoom(sheet || gif); };
  })(clip.sheet, clip.gif);
  gifStage.appendChild(gifImg);
  gifFig.appendChild(gifStage);
  gifFig.appendChild(el("figcaption", null, "matted loop (GIF)"));
  panes.appendChild(gifFig);

  var lotFig = el("figure");
  var lotStage = el("div", "stage");
  lotStage.id = "lot-" + clip.name;
  lotFig.appendChild(lotStage);
  lotFig.appendChild(el("figcaption", null, "lottie-web"));
  panes.appendChild(lotFig);

  card.appendChild(panes);

  // controls
  var ctls = el("div", "ctls");
  var btn = el("button");
  btn.textContent = "loading…";
  btn.setAttribute("data-name", clip.name);
  btn.onclick = function() { togglePlay(clip.name, btn); };
  ctls.appendChild(btn);

  var scrub = document.createElement("input");
  scrub.type = "range"; scrub.min = 0; scrub.max = 0; scrub.value = 0;
  scrub.className = "scrub";
  scrub.setAttribute("data-name", clip.name);
  scrub.oninput = function() { scrubTo(clip.name, scrub); };
  ctls.appendChild(scrub);

  var spd = el("select");
  spd.innerHTML = '<option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option>';
  spd.setAttribute("data-name", clip.name);
  spd.onchange = function() { setSpeed(clip.name, spd.value); };
  ctls.appendChild(spd);

  var loopBtn = el("button", "on", "loop");  // on by default
  loopBtn.setAttribute("data-loopname", clip.name);
  loopBtn.onclick = function() { toggleLoop(clip.name, loopBtn); };
  ctls.appendChild(loopBtn);

  var fr = el("span", "fr", "– / –f");
  fr.id = "fr-" + clip.name;
  ctls.appendChild(fr);

  var sz = el("span", "size");
  sz.setAttribute("data-name", clip.name);
  sz.setAttribute("data-orig", "0");
  ctls.appendChild(sz);

  card.appendChild(ctls);

  // gate chips
  var chips = el("div", "chips");
  var G = clip.gates || {};
  var ss = num(G.loop_ssim, 3), iou = num(G.loop_alpha_iou, 3);
  if (ss) chips.appendChild(chip("loop SSIM", ss, grade(G.loop_ssim, 0.97, 0.94)));
  if (iou) chips.appendChild(chip("IoU", iou, grade(G.loop_alpha_iou, 0.97, 0.93)));
  if (num(G.color_dL_max, 1))
    chips.appendChild(chip("dL max", num(G.color_dL_max, 1), grade(G.color_dL_max, 6, 12, true)));
  if (num(G.jerk_rms, 2))
    chips.appendChild(chip("jerk", num(G.jerk_rms, 2), grade(G.jerk_rms, 1, 3, true)));
  if (num(G.velocity_p95, 1))
    chips.appendChild(chip("vel p95", num(G.velocity_p95, 1), ""));
  if (chips.children.length) card.appendChild(chips);

  // meta row
  var meta = el("div", "meta");
  var v = pickLottie(clip.variants);
  if (v) {
    meta.appendChild(el("span", null, v.rung + " · " + fmtBytes(v.bytes)));
    meta.appendChild(el("span", "sep", "|"));
  }
  if (clip.raw_bytes) {
    meta.appendChild(el("span", null, "raw " + fmtBytes(clip.raw_bytes)));
    meta.appendChild(el("span", "sep", "|"));
  }
  if (clip.gates && clip.gates.frames) {
    meta.appendChild(el("span", null, clip.gates.frames + "f"));
    meta.appendChild(el("span", "sep", "|"));
  }
  if (clip.seed != null) {
    meta.appendChild(el("span", null, "seed " + clip.seed));
    meta.appendChild(el("span", "sep", "|"));
  }
  var links = [["sheet", clip.sheet], ["gates", clip.gates_png], ["mp4", clip.mp4]];
  links.forEach(function(pair) {
    if (!pair[1]) return;
    var a = el("a", null, pair[0]);
    a.href = pair[1]; a.target = "_blank";
    meta.appendChild(a);
    meta.appendChild(document.createTextNode(" "));
  });
  card.appendChild(meta);

  return card;
}

function zoom(src) {
  if (!src) return;
  var box = $("#box");
  box.querySelector("img").src = src;
  box.classList.add("on");
}

function togglePlay(name, btn) {
  var st = players[name];
  if (!st || !st.anim) return;
  if (st.anim.isPaused) { st.anim.play(); btn.textContent = "pause"; }
  else { st.anim.pause(); btn.textContent = "play"; }
}

function scrubTo(name, scrub) {
  var st = players[name];
  if (!st || !st.anim) return;
  st.scrubbing = true;
  st.anim.goToAndStop(Number(scrub.value), true);
  scrub.onchange = function() { st.scrubbing = false; };
}

function toggleLoop(name, btn) {
  var st = players[name];
  if (!st || !st.anim) return;
  var looping = !st.anim.loop;
  st.anim.loop = looping;
  btn.textContent = looping ? "loop" : "once";
  if (looping) btn.classList.add("on"); else btn.classList.remove("on");
}

function setSpeed(name, val) {
  var st = players[name];
  if (st && st.anim) st.anim.setSpeed(parseFloat(val));
}

$("#box").onclick = function() { $("#box").classList.remove("on"); };
addEventListener("keydown", function(e) { if (e.key === "Escape") $("#box").classList.remove("on"); });

// ---- Lottie player ----

var loadSeqs = {};

function loadLottie(clip) {
  var name = clip.name;
  var v = pickLottie(clip.variants);
  if (!v) return;

  if (!loadSeqs[name]) loadSeqs[name] = 0;
  var seq = ++loadSeqs[name];

  var old = players[name];
  if (old && old.anim) { old.anim.destroy(); }

  var lotDiv = document.getElementById("lot-" + name);
  if (lotDiv) lotDiv.textContent = "";
  var frEl = document.getElementById("fr-" + name);
  if (frEl) frEl.textContent = "loading " + fmtBytes(v.bytes) + "…";

  fetch(v.url, { cache: "no-store" })
    .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)); })
    .then(function(data) {
      if (loadSeqs[name] !== seq) return;
      var anim = lottie.loadAnimation({
        container: document.getElementById("lot-" + name),
        renderer: "canvas",
        loop: true,
        autoplay: true,
        animationData: data,
        rendererSettings: { preserveAspectRatio: "xMidYMid meet" },
      });
      anim.addEventListener("DOMLoaded", function() {
        if (loadSeqs[name] !== seq) return;
        var btn = document.querySelector('button[data-name="' + name + '"]');
        if (btn) btn.textContent = "pause";
        var scrub = document.querySelector('input[data-name="' + name + '"]');
        if (scrub) scrub.max = Math.max(0, Math.round(anim.totalFrames) - 1);
        updateSize(name);
      });
      anim.addEventListener("enterFrame", function() {
        if (loadSeqs[name] !== seq) return;
        var st = players[name];
        if (!st || st.scrubbing) return;
        var scrub = document.querySelector('input[data-name="' + name + '"]');
        if (scrub) scrub.value = Math.round(anim.currentFrame);
        updateSize(name);
      });
      anim.addEventListener("data_failed", function() {
        var el = document.getElementById("fr-" + name);
        if (el) el.textContent = "parse failed";
      });
      players[name] = { anim: anim, scrubbing: false, variant: v };
    })
    .catch(function(e) {
      if (loadSeqs[name] === seq) {
        var el = document.getElementById("fr-" + name);
        if (el) el.textContent = "load failed: " + e.message;
      }
    });
}

function updateSize(name) {
  var st = players[name];
  if (!st || !st.anim || !st.variant) return;
  var f = Math.round(st.anim.currentFrame);
  var tot = Math.round(st.anim.totalFrames);
  var frEl = document.getElementById("fr-" + name);
  if (frEl) frEl.textContent = f + " / " + (tot - 1) + "f";

  var szEl = document.querySelector('span.size[data-name="' + name + '"]');
  if (szEl && szEl.getAttribute("data-orig") === "0") {
    var v = st.variant;
    var txt = fmtBytes(v.bytes);
    if (v.gz_bytes) txt += " · " + fmtBytes(v.gz_bytes) + " gz";
    if (v.lottie_bytes) txt += " · " + fmtBytes(v.lottie_bytes) + " .lottie";
    szEl.textContent = txt;
    szEl.setAttribute("data-orig", "1");
  }
}

// ---- sizing ----

function applyScale(px) {
  document.documentElement.style.setProperty("--stage", px + "px");
  Object.keys(players).forEach(function(k) {
    var st = players[k];
    if (st && st.anim) st.anim.resize();
  });
}

$("#globalscale").onchange = function() { applyScale($("#globalscale").value); };
applyScale($("#globalscale").value);

// ---- global controls ----

$("#globalloop").onchange = function() {
  var val = $("#globalloop").checked;
  Object.keys(players).forEach(function(k) {
    var st = players[k];
    if (st && st.anim) st.anim.loop = val;
    var btn = document.querySelector('button[data-loopname="' + k + '"]');
    if (btn) {
      if (val) { btn.textContent = "loop"; btn.classList.add("on"); }
      else { btn.textContent = "once"; btn.classList.remove("on"); }
    }
  });
};

function allPlaying() {
  return Object.keys(players).some(function(k) {
    var st = players[k];
    return st && st.anim && !st.anim.isPaused;
  });
}

$("#globalplay").onclick = function() {
  var pause = allPlaying();
  Object.keys(players).forEach(function(k) {
    var st = players[k];
    if (!st || !st.anim) return;
    if (pause) st.anim.pause();
    else st.anim.play();
  });
  $("#globalplay").textContent = pause ? "play all" : "pause all";
};

// ---- render ----

function renderPackSel(packs) {
  var sel = $("#packsel");
  sel.textContent = "";
  if (packs.length <= 1) { sel.hidden = true; return; }
  sel.hidden = false;
  packs.forEach(function(p) {
    var o = el("option", null, p.title + " (" + p.clips.length + " clips)");
    o.value = p.name;
    sel.appendChild(o);
  });
  sel.onchange = function() {
    var p = packs.find(function(x) { return x.name === sel.value; });
    if (p) render(p);
  };
}

function render(pack) {
  try {
    hideLoading();
    var mascot = $("#mascot");
    mascot.textContent = "";
    if (pack.mascot_url) {
      var img = el("img");
      img.src = pack.mascot_url; img.alt = pack.name + " mascot";
      mascot.appendChild(img);
    }
    mascot.appendChild(el("h2", null, pack.title));
    mascot.appendChild(el("div", "sub", (pack.character || "") + (pack.created ? " — " + pack.created : "")));

    var grid = $("#grid");
    grid.textContent = "";
    pack.clips.forEach(function(clip) {
      grid.appendChild(buildCard(clip));
      setTimeout(function() { loadLottie(clip); }, 50);
    });
  } catch(e) {
    show("render error: " + e.message);
  }
}

// ---- fetch ----

function poll() {
  fetch("/api/packs", { cache: "no-store" })
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(m) {
      var id = JSON.stringify(m);
      if (id !== sig) {
        sig = id;
        manifest = m;
        renderPackSel(m.packs);
        if (m.packs.length) render(m.packs[0]);
        else show("no packs found — check LayerPeeler/out/packs/");
      }
      $("#stamp").textContent = "synced " + new Date().toLocaleTimeString();
    })
    .catch(function(e) {
      show("fetch error: " + e.message + " — is the server running?");
      $("#stamp").textContent = "server offline";
    });
}
poll();
setInterval(poll, 5000);
})();
</script>
</html>
