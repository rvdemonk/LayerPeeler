<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gumbo — sunset hunt</title>
<style>
  :root {
    --ink: #f4e7d6;
    --ink-dim: #cbb89d;
    --ink-faint: rgba(244,231,214,.55);
    --accent: #ffb56b;
    --accent-soft: rgba(255,181,107,.18);
    --ui-bg: rgba(22,16,41,.55);
    --ui-border: rgba(244,231,214,.14);
    --waterline: 30%;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    color: var(--ink);
    overflow: hidden;
    background: #161029;
    user-select: none;
  }

  /* ---------- the scene ---------- */
  .scene {
    position: fixed; inset: 0;
    overflow: hidden;
    background:
      radial-gradient(130% 90% at 50% 66%, rgba(255,140,90,.34), transparent 58%),
      radial-gradient(60% 50% at 78% 14%, rgba(255,214,150,.12), transparent 60%),
      linear-gradient(180deg,
        #141020 0%, #241542 30%, #442262 48%, #7a3a5c 62%,
        #c45a4c 68%, #ee8f4e 72%, #f3b065 74%,
        #1d2c4d 74%, #131f3a 100%);
    transition: filter 2s linear;
  }
  .scene.night { filter: brightness(.45) saturate(.7); }
  .moon {
    position: absolute; top: 9%; right: 12%;
    width: 88px; height: 88px; border-radius: 50%;
    background: radial-gradient(circle at 38% 36%, #fff3da, #ffdfa8 60%, #ffc97d);
    box-shadow: 0 0 60px 18px rgba(255,223,168,.35);
    opacity: .92;
  }
  .sun {
    position: absolute; left: 26%;
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #ffe9b0, #ffb56b 60%, #ff8a4c);
    box-shadow: 0 0 70px 24px rgba(255,181,107,.5);
    transition: bottom 60s linear;
    z-index: 1;
  }

  /* ambient sky fireflies (decorative) */
  .firefly {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #ffe9b0;
    box-shadow: 0 0 8px 3px rgba(255,233,176,.5);
    opacity: 0;
    animation: drift 18s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes drift {
    0%   { opacity: 0; transform: translate(0,0) }
    8%   { opacity: .7 }
    30%  { transform: translate(40px,-28px) }
    50%  { transform: translate(-26px,-52px) }
    72%  { transform: translate(24px,-18px) }
    88%  { opacity: .5 }
    100% { opacity: 0; transform: translate(0,0) }
  }

  /* water */
  .water {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--waterline);
    background: linear-gradient(180deg, rgba(16,30,58,.55), rgba(9,18,38,.9));
    backdrop-filter: blur(1px);
    overflow: hidden;
  }
  .water::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg,
      transparent 0 60px, rgba(240,190,120,.035) 60px 62px,
      transparent 62px 130px, rgba(240,190,120,.03) 130px 131px);
    animation: shimmer 24s linear infinite;
  }
  @keyframes shimmer { from { transform: translateX(-130px) } to { transform: translateX(130px) } }
  .waterline-glow {
    position: absolute; left: 0; right: 0; bottom: var(--waterline);
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,190,120,.7), transparent);
    box-shadow: 0 0 14px 2px rgba(255,190,120,.4);
  }

  /* distant silhouettes */
  .hills {
    position: absolute; left: 0; right: 0; bottom: var(--waterline);
    height: 42%; opacity: .5;
  }
  .hills svg { width: 100%; height: 100%; display: block; }

  /* lily pads & pebbles on the water (behind the frog) */
  .mid { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .lily {
    position: absolute;
    width: 64px; height: 26px;
    background: radial-gradient(ellipse at 30% 40%, #3c5a46, #24392e 75%);
    border-radius: 50%;
    box-shadow: inset 0 4px 8px rgba(255,255,255,.06), 0 4px 10px rgba(0,0,0,.35);
  }
  .lily::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 8px; height: 8px; transform: translate(-50%,-50%);
    background: #1b2a21; border-radius: 50%; opacity: .7;
  }
  .pebble {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #6b5a78, #3a2f4a 78%);
    box-shadow: 0 3px 8px rgba(0,0,0,.4);
  }

  /* foreground reed — the frog hides BEHIND this (the safe zone) */
  .reed {
    position: absolute; z-index: 5; pointer-events: none;
    bottom: calc(var(--waterline) - 6px);
    left: 64%;
    transform: translateX(-50%);
    width: 220px; height: 380px;
    filter: drop-shadow(0 0 6px rgba(0,0,0,.4));
  }
  .reed svg { width: 100%; height: 100%; display: block; }

  /* ---------- the pet ---------- */
  .pet {
    position: absolute; z-index: 6;
    width: 150px; height: 150px;
    left: 0; bottom: calc(var(--waterline) + 6px);
    transition: none;
    will-change: transform, left;
  }
  .pet.behind { z-index: 3; }  /* hiding behind the reed — true compositing */
  .pet.big { width: 190px; height: 190px; }
  .shadow {
    position: absolute; left: 50%; bottom: -18px;
    width: 96px; height: 20px; transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0,0,0,.42), transparent 68%);
    border-radius: 50%;
    transition: width .3s, opacity .3s;
  }
  .pet.dragging .shadow { width: 70px; opacity: .55; }
  #frog { position: absolute; inset: 0; }
  #frog .layer { position: absolute; inset: 0; }
  #frog .layer.on { z-index: 2; }
  #frog .layer.off { z-index: 1; }

  /* ---------- the prey: fireflies to catch ---------- */
  .prey {
    position: absolute; z-index: 4;
    width: 30px; height: 30px;
    cursor: pointer;
  }
  .prey::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 9px; height: 9px;
    transform: translate(-50%,-50%);
    background: #ffe9b0; border-radius: 50%;
    box-shadow: 0 0 14px 5px rgba(255,233,176,.55);
  }
  .prey.gold::before {
    width: 13px; height: 13px;
    background: #ffd76b;
    box-shadow: 0 0 18px 7px rgba(255,206,80,.75);
  }
  .prey:hover::before { box-shadow: 0 0 18px 8px rgba(255,233,176,.85); }
  .prey.caught::before { animation: catch-pop .4s ease-out forwards; }
  @keyframes catch-pop {
    0% { transform: translate(-50%,-50%) scale(1); opacity: 1 }
    100% { transform: translate(-50%,-50%) scale(3.2); opacity: 0 }
  }
  .sparkle {
    position: absolute; z-index: 4; pointer-events: none;
    border-radius: 50%; background: #fff3da;
    animation: sparkle-fly .6s ease-out forwards;
  }
  @keyframes sparkle-fly {
    0% { transform: translate(0,0) scale(1); opacity: 1 }
    100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0 }
  }

  /* ---------- the heron ---------- */
  .heron {
    position: absolute; z-index: 4;
    left: -220px; top: 24%;
    width: 190px; height: 150px;
    opacity: 0;
    pointer-events: none;
  }
  .heron svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 4px rgba(0,0,0,.6)); }
  .heron.on { animation: heron-fly 3.2s ease-in forwards; opacity: 1; }
  @keyframes heron-fly {
    0% { left: -220px; transform: translateY(0) }
    15% { transform: translateY(14px) }
    85% { transform: translateY(8px) }
    100% { left: 105%; transform: translateY(16px) }
  }
  .heron-warn {
    position: absolute; z-index: 8;
    top: 18%; left: 50%; transform: translateX(-50%);
    font-size: 15px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--accent); text-shadow: 0 0 18px rgba(0,0,0,.8);
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .heron-warn.on { opacity: 1; animation: warn-pulse .6s ease-in-out infinite; }
  @keyframes warn-pulse { 0%,100% { opacity:.4 } 50% { opacity:1 } }

  /* ---------- chrome / ui ---------- */
  .wordmark {
    position: fixed; top: 22px; left: 26px; z-index: 20;
    pointer-events: none;
  }
  .wordmark h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-weight: 400; font-size: 34px; letter-spacing: .5px; line-height: 1;
    color: var(--ink);
    text-shadow: 0 2px 18px rgba(0,0,0,.45);
  }
  .wordmark .tag {
    margin-top: 6px; font-size: 11px; letter-spacing: 2.4px;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .wordmark .tag b { color: var(--accent); font-weight: 600; }

  .mood {
    position: fixed; top: 22px; right: 26px; z-index: 20;
    display: flex; align-items: center; gap: 9px;
    padding: 8px 14px;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    border-radius: 999px;
    font-size: 12.5px; letter-spacing: .4px; color: var(--ink);
    backdrop-filter: blur(8px);
  }
  .mood .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); animation: breathe-dot 2.2s ease-in-out infinite;
  }
  @keyframes breathe-dot { 0%,100% { opacity:.4; transform:scale(.85) } 50% { opacity:1; transform:scale(1.15) } }
  .mood span { color: var(--ink-faint); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }

  .hud {
    position: fixed; top: 66px; right: 26px; z-index: 20;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  }
  .hud .pill {
    padding: 8px 14px;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    border-radius: 999px;
    font-size: 12.5px; color: var(--ink); backdrop-filter: blur(8px);
  }
  .hud .pill b { color: var(--accent); font-weight: 600; }
  .hud .pill span { color: var(--ink-faint); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }

  .meter {
    position: fixed; top: 26px; left: 50%; transform: translateX(-50%);
    z-index: 20;
    width: min(340px, 50vw); height: 5px;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    border-radius: 999px; overflow: hidden;
    backdrop-filter: blur(8px);
  }
  .meter .fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff8a4c, #ffb56b, #ffdfa8);
    transition: width .3s linear;
  }

  .hint {
    position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%);
    z-index: 20;
    font-size: 12px; color: var(--ink-faint); letter-spacing: .3px;
    text-align: center; white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,.5);
  }
  .hint b { color: var(--ink-dim); font-weight: 500; }

  .dock {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 20;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    justify-content: center;
    padding: 10px 14px;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    border-radius: 18px;
    backdrop-filter: blur(10px);
    max-width: calc(100vw - 40px);
  }
  .dock .label {
    font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--ink-faint); padding-right: 4px;
  }
  .chip {
    padding: 7px 13px; border-radius: 999px; cursor: pointer;
    font-size: 12.5px; color: var(--ink-dim); letter-spacing: .3px;
    border: 1px solid transparent; transition: all .15s;
    background: transparent;
  }
  .chip:hover { color: var(--ink); background: var(--accent-soft); }
  .chip.active { color: #2a1b12; background: var(--accent); font-weight: 600; }

  .toast {
    position: fixed; top: 20%; left: 50%; transform: translateX(-50%) scale(.9);
    z-index: 30;
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 30px; color: var(--accent);
    text-shadow: 0 2px 20px rgba(0,0,0,.7);
    opacity: 0; pointer-events: none;
    transition: all .25s;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) scale(1); }

  .round-end {
    position: fixed; inset: 0; z-index: 35;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(20,14,36,.72);
    backdrop-filter: blur(6px);
  }
  .round-end.on { display: flex; }
  .round-end h2 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-weight: 400; font-size: 34px; color: var(--ink);
  }
  .round-end .score { font-size: 18px; color: var(--ink-dim); }
  .round-end .score b { color: var(--accent); font-size: 30px; }
  .round-end .btn {
    margin-top: 10px; padding: 12px 26px; border-radius: 999px;
    border: 1px solid var(--accent); background: var(--accent);
    color: #2a1b12; font-size: 14px; letter-spacing: .5px; cursor: pointer;
  }
  .round-end .btn:hover { filter: brightness(1.08); }

  .boot {
    position: fixed; inset: 0; z-index: 40;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: #161029;
    transition: opacity .7s;
  }
  .boot.hidden { opacity: 0; pointer-events: none; }
  .boot .title {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 40px; color: var(--ink); letter-spacing: .5px;
  }
  .boot .sub { font-size: 12px; color: var(--ink-faint); letter-spacing: 2px; text-transform: uppercase; }
  .boot .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--ui-border); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }

  @media (max-width: 640px) {
    .wordmark h1 { font-size: 26px; }
    .pet { width: 110px; height: 110px; }
    .pet.big { width: 140px; height: 140px; }
    .hint { bottom: 92px; white-space: normal; width: 86vw; }
    .moon { width: 60px; height: 60px; }
    .hud { top: 58px; }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="sun" id="sun"></div>
  <div class="moon"></div>
  <div class="hills">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="#241538" d="M0,220 C160,120 260,260 420,180 C580,100 660,240 820,190 C1000,130 1080,230 1260,170 C1340,140 1400,150 1440,150 L1440,320 L0,320 Z"/>
      <path fill="#3a2450" d="M0,260 C140,200 300,280 480,230 C640,190 760,270 940,230 C1120,190 1260,270 1440,220 L1440,320 L0,320 Z"/>
    </svg>
  </div>

  <div class="mid">
    <div class="lily" style="left:12%; bottom:14%"></div>
    <div class="lily" style="left:38%; bottom:6%; transform:scale(.7)"></div>
    <div class="lily" style="right:18%; bottom:18%; transform:scale(.55)"></div>
    <div class="pebble" style="left:24%; bottom:4%; width:14px; height:11px"></div>
    <div class="pebble" style="right:30%; bottom:8%; width:10px; height:8px"></div>
  </div>

  <div id="prey-layer"></div>

  <div class="reed">
    <svg viewBox="0 0 220 380" preserveAspectRatio="xMidYMax meet">
      <g fill="#1a1030">
        <path d="M104,378 Q118,250 96,120 L128,120 Q108,250 120,378 Z"/>
        <path d="M78,378 Q74,240 40,160 L66,150 Q84,250 92,378 Z"/>
        <path d="M148,378 Q156,230 196,150 L170,142 Q142,250 132,378 Z"/>
      </g>
      <g fill="#241542">
        <ellipse cx="106" cy="118" rx="16" ry="46" transform="rotate(8 106 118)"/>
        <ellipse cx="58" cy="158" rx="14" ry="38" transform="rotate(-24 58 158)"/>
        <ellipse cx="168" cy="148" rx="14" ry="40" transform="rotate(22 168 148)"/>
      </g>
    </svg>
  </div>

  <div class="heron" id="heron">
    <svg viewBox="0 0 190 150" preserveAspectRatio="xMidYMid meet">
      <g fill="#12091f">
        <path d="M28,138 C30,110 34,92 44,80 L52,84 C44,96 42,112 40,138 Z"/>
        <path d="M40,80 C50,64 66,56 84,58 C100,60 112,68 118,80 C124,92 122,104 112,110 L106,104 C112,98 113,90 109,84 C103,76 92,70 80,68 C66,66 54,72 46,84 Z"/>
        <circle cx="116" cy="64" r="3.4"/>
        <path d="M112,60 L124,58 L128,60 L124,62 Z"/>
        <path d="M84,100 C88,124 92,132 90,148 L96,148 C98,130 96,118 92,100 Z"/>
        <path d="M86,146 L96,150 L92,152 Z"/>
      </g>
    </svg>
  </div>
  <div class="heron-warn" id="heron-warn">the heron is coming — hide behind the reeds!</div>

  <div class="waterline-glow"></div>
  <div class="water"></div>

  <div class="pet" id="pet">
    <div class="shadow"></div>
    <div id="frog">
      <div class="layer on" id="frog-a"></div>
      <div class="layer off" id="frog-b"></div>
    </div>
  </div>
</div>

<div class="wordmark">
  <h1>gumbo</h1>
  <div class="tag">sunset <b>hunt</b> &nbsp;·&nbsp; catch the fireflies before dark</div>
</div>

<div class="mood" id="mood"><div class="dot"></div><span id="moodword">waking up</span></div>

<div class="hud">
  <div class="pill"><span>caught</span> &nbsp;<b id="hud-caught">0</b></div>
  <div class="pill"><span>best</span> &nbsp;<b id="hud-best">0</b></div>
</div>

<div class="meter"><div class="fill" id="meter-fill"></div></div>

<div class="hint"><b>click a firefly</b> to catch it &nbsp;·&nbsp; <b>hide behind the reeds</b> when the heron comes &nbsp;·&nbsp; catch 10 for a dance party</div>

<div class="toast" id="toast"></div>

<div class="round-end" id="round-end">
  <h2>goodnight, gumbo</h2>
  <div class="score">you caught <b id="final-score">0</b> fireflies</div>
  <div class="score" id="final-best"></div>
  <button class="btn" id="btn-again">one more sunset</button>
</div>

<div class="boot" id="boot">
  <div class="title">gumbo</div>
  <div class="sub">is waking up</div>
  <div class="spinner"></div>
</div>

<script src="/vendor/lottie.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------- animation registry ----------
  const IDLE     = 'frog-idle-breathe';
  const SCAN     = 'frog-idle-scan';
  const WALK     = 'frog-walk';
  const SURPRISE = 'frog-surprise-pop';
  const GASP     = 'frog-surprise-gasp';
  const WAVE     = 'frog-wave-v8-aa-w125';
  const EMOTES   = {
    boogie: 'frog-boogie5',
    bop:    'frog-bop',
    groove: 'frog-groove',
    sway:   'frog-sway',
    gasp:   'frog-surprise-gasp',
  };
  const BASE = '/media/pipeline/';
  const json = (n) => BASE + n + '/ladder/' + n + '.512webp-q65-24.json';
  const PRELOAD = [IDLE, SCAN, WALK, SURPRISE, GASP, WAVE,
                   EMOTES.boogie, EMOTES.bop, EMOTES.groove, EMOTES.sway];

  // ---------- walk displacement ----------
  const WS = 12, WC = 27, WL = 100, WD = 110, WMAX = 121;
  const vel = (f) =>
    f <= WS ? 0 :
    f < WC ? (f - WS) / (WC - WS) :
    f < WL ? 1 :
    f < WD ? (WD - f) / (WD - WL) : 0;
  let _tot = 0; for (let f = 0; f <= WMAX; f++) _tot += vel(f);
  const disp = new Float32Array(WMAX + 1);
  { let a = 0; for (let f = 0; f <= WMAX; f++) { a += vel(f); disp[f] = a / _tot; } }

  // ---------- dom ----------
  const scene    = document.getElementById('scene');
  const petEl    = document.getElementById('pet');
  const bootEl   = document.getElementById('boot');
  const moodEl   = document.getElementById('moodword');
  const preyLayer= document.getElementById('prey-layer');
  const heronEl  = document.getElementById('heron');
  const heronWarn= document.getElementById('heron-warn');
  const sunEl    = document.getElementById('sun');
  const meterEl  = document.getElementById('meter-fill');
  const toastEl  = document.getElementById('toast');
  const hudCaught= document.getElementById('hud-caught');
  const hudBest  = document.getElementById('hud-best');
  const roundEnd = document.getElementById('round-end');
  const finalScore = document.getElementById('final-score');
  const finalBest  = document.getElementById('final-best');

  let stageW = window.innerWidth, stageH = window.innerHeight;
  const MARGIN = 70;

  // ---------- state ----------
  let anim = null;
  let cache = {};
  let state = 'BOOT';
  let petX = 0;
  let facing = 1;
  let emotePick = 'boogie';
  let idleTimer = null, emoteTimer = null;
  let away = false;
  const MOODS = {
    BOOT: 'waking up', IDLE: 'content', WALKING: 'on his way',
    DRAGGING: 'wheee', EMOTE: 'performing', AWAY: 'waving you back',
  };

  const $arriveTimeout = 6000;
  const setMood = () => { moodEl.textContent = MOODS[state] || state.toLowerCase(); };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const clearTimers = () => { clearTimeout(idleTimer); clearTimeout(emoteTimer); idleTimer = emoteTimer = null; };

  // ---------- lottie control (flicker-free cover-swap) ----------
  let pendingAnim = null, activeLayer = 'a';
  let animLoops = false;
  const frogA = document.getElementById('frog-a');
  const frogB = document.getElementById('frog-b');
  const layerOn = (l) => { l.classList.remove('off'); l.classList.add('on'); };
  const layerOff = (l) => { l.classList.remove('on'); l.classList.add('off'); };

  function swap(src, loop, onReady) {
    const data = cache[src];
    if (!data) return;
    animLoops = !!loop;
    if (pendingAnim) { try { pendingAnim.destroy(); } catch (_) {} pendingAnim = null; }
    const back = activeLayer === 'a' ? frogB : frogA;
    let a;
    try {
      a = lottie.loadAnimation({
        container: back, renderer: 'canvas',
        loop: !!loop, autoplay: false, animationData: data,
        rendererSettings: { preserveAspectRatio: 'xMidYMid meet' },
      });
    } catch (err) { return; }
    pendingAnim = a;
    a.addEventListener('DOMLoaded', () => {
      if (pendingAnim !== a) { try { a.destroy(); } catch (_) {} return; }
      pendingAnim = null;
      const front = activeLayer === 'a' ? frogA : frogB;
      if (anim) { try { anim.destroy(); } catch (_) {} }
      anim = a;
      layerOff(front); layerOn(back);
      activeLayer = activeLayer === 'a' ? 'b' : 'a';
      if (onReady) onReady(a);
      else a.play();
    });
  }
  function oneShot(src, then) {
    swap(src, false, (a) => {
      const off = a.addEventListener('complete', () => { off(); if (then) then(); });
      a.play();
    });
  }

  // ---------- occlusion: the reed is the safe zone ----------
  const REED_CX = 0.64, REED_W = 130;
  function isBehind() {
    const cx = petX + petEl.offsetWidth / 2;
    const reedLeft = stageW * REED_CX - REED_W / 2;
    const reedRight = stageW * REED_CX + REED_W / 2;
    return cx > reedLeft && cx < reedRight;
  }
  function updateOcclusion() {
    petEl.classList.toggle('behind', isBehind());
  }

  function place(x, noFlip) {
    petX = clamp(x, MARGIN, stageW - MARGIN);
    petEl.style.left = petX + 'px';
    if (!noFlip) facing = 1;
    petEl.style.transform = 'scaleX(' + facing + ')';
    updateOcclusion();
  }

  // ---------- idle behaviour ----------
  function idle() {
    state = 'IDLE'; setMood(); clearTimers();
    clearPendingEmote();
    petEl.classList.remove('dragging');
    petEl.style.transform = 'scaleX(' + facing + ')';
    swap(IDLE, true);
    scheduleIdleLife();
  }
  function scheduleIdleLife() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (state !== 'IDLE' || away) return;
      state = 'SCAN'; setMood();
      oneShot(SCAN, () => { if (state === 'SCAN') finishMotion(); });
      scheduleIdleLife();
    }, 9000 + Math.random() * 7000);
  }

  // ---------- walk (queued) ----------
  let walkTargets = [];
  let pendingCatch = null;
  function walkTo(targetX) {
    if (cache[WALK] === undefined) return;
    const target = clamp(targetX, MARGIN, stageW - MARGIN);
    if (state === 'WALKING') { walkTargets.push(target); return; }
    clearTimers(); clearPendingEmote();
    beginWalk(target);
  }
  function beginWalk(target) {
    const fromX = petX;
    const dist = target - fromX;
    if (Math.abs(dist) < 26) { nextWalk(); return; }
    facing = dist > 0 ? 1 : -1;
    state = 'WALKING'; setMood();
    petEl.classList.remove('dragging');
    petEl.style.transform = 'scaleX(' + facing + ')';
    const travel = Math.abs(dist);
    swap(WALK, false, (a) => {
      a.addEventListener('enterFrame', () => {
        const f = clamp(Math.round(a.currentFrame), 0, WMAX);
        const p = disp[f];
        petX = fromX + facing * p * travel;
        petEl.style.left = petX + 'px';
        updateOcclusion();
      });
      a.addEventListener('complete', () => { place(target, true); nextWalk(); });
      a.play();
    });
  }
  function nextWalk() {
    if (walkTargets.length) { beginWalk(walkTargets.shift()); }
    else { tryCatchOnArrival(); }
  }
  function tryCatchOnArrival() {
    // he reached the end of his walk: if a prey is still in reach, catch it.
    if (pendingCatch && pendingCatch.alive) {
      const dx = Math.abs((petX + petEl.offsetWidth / 2) - pendingCatch.x);
      const p = pendingCatch;
      pendingCatch = null;
      if (dx <= CATCH_RADIUS + 20) { doCatch(p); return; }
    }
    pendingCatch = null;
    arrival();
  }

  function arrival() {
    state = 'EMOTE'; setMood();
    const src = EMOTES[emotePick] || EMOTES.boogie;
    swap(src, true);
    clearTimeout(emoteTimer);
    emoteTimer = setTimeout(() => { if (state === 'EMOTE') finishMotion(); }, $arriveTimeout);
  }

  // ---------- deferred emote ----------
  let pendingEmote = null, pendingEmoteOff = null;
  function clearPendingEmote() {
    pendingEmote = null;
    walkTargets.length = 0;
    pendingCatch = null;
    if (pendingEmoteOff) { try { pendingEmoteOff(); } catch (_) {} pendingEmoteOff = null; }
  }
  function finishMotion() {
    if (pendingEmote) { pendingEmote = null; arrival(); }
    else idle();
  }
  function requestEmote(name) {
    emotePick = name;
    if (state === 'WALKING' || state === 'DRAGGING' || away) return;
    if (state === 'EMOTE' && animLoops && anim) {
      clearPendingEmote();
      pendingEmote = name;
      pendingEmoteOff = anim.addEventListener('loopComplete', () => {
        clearPendingEmote();
        arrival();
      });
    } else if ((state === 'EMOTE' || state === 'SCAN') && anim) {
      pendingEmote = name;
    } else {
      clearTimers();
      arrival();
    }
  }

  // ---------- drag + tap + double-tap ----------
  let dragMode = false;
  let dragLast = { x: 0, t: 0 }, dragFar = false, dragFast = false;
  let tapTimer = null, tapArmed = false;

  function beginPetGesture(e) {
    if (cache[IDLE] === undefined) return;
    if (tapArmed) { clearTimeout(tapTimer); tapArmed = false; startle(); return; }
    tapArmed = true;
    tapTimer = setTimeout(() => { tapArmed = false; }, 320);
    dragMode = false; dragFar = false; dragFast = false;
    dragLast = { x: e.clientX, t: performance.now() };
    document.addEventListener('pointermove', onPetMove);
    document.addEventListener('pointerup', onPetUp, { once: true });
  }
  function onPetMove(e) {
    const dx = e.clientX - dragLast.x;
    if (!dragMode && Math.abs(dx) > 6) {
      dragMode = true;
      clearTimers(); clearPendingEmote();
      state = 'DRAGGING'; setMood();
      petEl.classList.add('dragging');
      swap(IDLE, true);
    }
    if (!dragMode) return;
    const now = performance.now();
    const dt = now - dragLast.t;
    if (dt > 0 && Math.abs(dx) / dt > 0.55) dragFast = true;
    if (Math.abs(dx) > 14) dragFar = true;
    dragLast = { x: e.clientX, t: now };
    facing = dx < 0 ? -1 : 1;
    place(e.clientX, true);
    const t = now / 1000;
    const tilt = Math.sin(t * 7) * 3.2;
    const squash = 1 + Math.sin(t * 11) * 0.05;
    petEl.style.transform = 'scaleX(' + facing + ') rotate(' + tilt + 'deg) scale(' + (1 / squash) + ',' + squash + ')';
    updateOcclusion();
  }
  function onPetUp() {
    document.removeEventListener('pointermove', onPetMove);
    clearTimeout(tapTimer);
    if (dragMode) {
      tapArmed = false;
      petEl.classList.remove('dragging');
      petEl.style.transform = 'scaleX(' + facing + ')';
      if (dragFast && dragFar) { startle(); }
      else { idle(); }
    } else {
      tapTimer = setTimeout(() => { tapArmed = false; petHim(); }, 320);
    }
  }

  // ---------- surprise + gasp ----------
  function startle() {
    clearTimers(); clearPendingEmote();
    state = 'EMOTE'; setMood();
    oneShot(SURPRISE, () => { if (state === 'EMOTE') finishMotion(); });
  }
  function petHim() {
    clearTimers(); clearPendingEmote();
    state = 'EMOTE'; setMood();
    oneShot(GASP, () => { if (state === 'EMOTE') finishMotion(); });
  }

  // ---------- scene interaction ----------
  scene.addEventListener('pointerdown', (e) => {
    if (cache[IDLE] === undefined || !roundActive) return;
    // firefly click? (not during the dance party — he's busy celebrating)
    const preyEl = e.target.closest('.prey');
    if (preyEl && preyEl.dataset && !partyActive) {
      const p = preyMap.get(preyEl);
      if (p && p.alive) { clickPrey(p); return; }
    }
    const rect = petEl.getBoundingClientRect();
    const onPet = e.clientX >= rect.left && e.clientX <= rect.right &&
                  e.clientY >= rect.top && e.clientY <= rect.bottom;
    if (onPet) { beginPetGesture(e); return; }
    walkTo(e.clientX - petEl.offsetWidth / 2);
  });

  document.querySelectorAll('.chip[data-emote]').forEach((c) => {
    c.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-emote]').forEach((x) => x.classList.remove('active'));
      c.classList.add('active');
      requestEmote(c.dataset.emote);
    });
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      away = true; clearTimers(); clearPendingEmote();
      state = 'AWAY'; setMood();
      petEl.classList.remove('dragging');
      petEl.style.transform = 'scaleX(' + facing + ')';
      swap(WAVE, true);
    } else if (away) {
      away = false;
      startle();
    }
  });

  window.addEventListener('resize', () => {
    stageW = window.innerWidth; stageH = window.innerHeight;
    place(petX, true); updateOcclusion();
  });

  // ================= THE GAME =================
  // Round: catch fireflies before the sun sets. Heron visits periodically;
  // if gumbo is in the open when it passes he drops 3. Every 10 catches = party.
  const ROUND_SECS = 60;
  const PREY_KEEP = 6;            // concurrent fireflies
  const CATCH_RADIUS = 64;
  let roundActive = false;
  let roundTimer = null;
  let timeLeft = ROUND_SECS;
  let catches = 0;
  let nextPartyAt = 10;
  let best = 0;
  try { best = +localStorage.getItem('gumbo-sunset-best') || 0; } catch (_) {}
  hudBest.textContent = best;

  const preyMap = new Map();
  let heronTimeout = null, heronActive = false;
  let partyTimer = null, partyActive = false;

  // ---------- prey ----------
  function spawnPrey() {
    const el = document.createElement('div');
    el.className = 'prey';
    const gold = Math.random() < 0.12;
    if (gold) el.classList.add('gold');
    const p = {
      el, gold,
      alive: true,
      shy: !gold && Math.random() < 0.3,
      x: stageW * (0.08 + Math.random() * 0.84),
      y: stageH * (0.26 + Math.random() * 0.10),
      phase: Math.random() * Math.PI * 2,
      speed: (gold ? 55 : 30 + Math.random() * 30) * (Math.random() < 0.5 ? 1 : -1),
      bobAmp: 8 + Math.random() * 10,
      bobSpeed: 1 + Math.random() * 1.5,
      targeted: false,
    };
    el.style.left = p.x + 'px';
    el.style.bottom = p.y + 'px';
    preyLayer.appendChild(el);
    preyMap.set(el, p);
    return p;
  }
  function despawn(p) {
    p.alive = false;
    if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
    preyMap.delete(p.el);
  }
  function burstSparkles(x, y) {
    for (let i = 0; i < 10; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      const ang = Math.random() * Math.PI * 2;
      const dist = 20 + Math.random() * 30;
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      s.style.left = x + 'px';
      s.style.bottom = y + 'px';
      s.style.width = s.style.height = (2 + Math.random() * 4) + 'px';
      scene.appendChild(s);
      setTimeout(() => s.remove(), 650);
    }
  }
  function doCatch(p) {
    if (!p.alive) return;
    despawn(p);
    burstSparkles(p.x, p.y);
    catches += p.gold ? 5 : 1;
    hudCaught.textContent = catches;
    // he celebrates the catch
    clearTimers(); clearPendingEmote();
    state = 'EMOTE'; setMood();
    oneShot(p.gold ? SURPRISE : GASP, () => { if (state === 'EMOTE') finishMotion(); });
    toast(p.gold ? '+5 gold!' : '+1');
    maybeParty();
    setTimeout(() => { if (roundActive) spawnPrey(); }, 800);
  }
  function clickPrey(p) {
    if (p.shy && p.alive) {
      // darts away
      p.shy = false;
      const dir = petX < p.x ? 1 : -1;
      p.x += dir * 140;
      p.x = clamp(p.x, MARGIN, stageW - MARGIN);
      p.speed *= -1;
      toast('it got away!');
      return;
    }
    // walk to it, then catch on arrival
    pendingCatch = p;
    const tgtX = clamp(p.x - petEl.offsetWidth / 2, MARGIN, stageW - MARGIN);
    if (state === 'WALKING') { walkTargets.push(tgtX); }
    else { clearTimers(); clearPendingEmote(); beginWalk(tgtX); }
    p.targeted = true;
  }

  function maybeParty() {
    if (catches >= nextPartyAt && !partyActive) {
      nextPartyAt = catches + 10;
      startParty();
    }
  }
  function startParty() {
    partyActive = true;
    toast(catches + '! dance party!');
    clearTimers(); clearPendingEmote();
    state = 'EMOTE'; setMood();
    // cycle through the dance moves
    const moves = [EMOTES.boogie, EMOTES.bop, EMOTES.groove, EMOTES.sway];
    let i = 0;
    const step = () => {
      if (!partyActive) return;
      swap(moves[i % moves.length], true);
      i++;
    };
    step();
    partyTimer = setInterval(step, 3600);
    // pause the sunset during the party — it's a reward, not a penalty.
    // Remember where the sun was; resume there, don't restart the clock.
    const pausedAt = timeLeft;
    if (roundTimer) { clearInterval(roundTimer); roundTimer = null; }
    setTimeout(() => {
      clearInterval(partyTimer); partyTimer = null;
      if (!roundActive) return;   // the sunset ended during the party
      partyActive = false;
      state = 'IDLE';
      idle();
      startRoundClock(pausedAt);
    }, 4000);
  }

  // ---------- the sun / round clock ----------
  // `remaining` lets us pause (party) and resume from where the sun was,
  // instead of giving him a fresh 60s every time.
  function startRoundClock(remaining) {
    if (roundTimer) clearInterval(roundTimer);
    timeLeft = remaining == null ? ROUND_SECS : remaining;
    const t0 = performance.now();
    const pct = timeLeft / ROUND_SECS;
    sunEl.style.transition = 'none';
    sunEl.style.bottom = (16 + 40 * pct) + '%';
    requestAnimationFrame(() => {
      sunEl.style.transition = 'bottom ' + timeLeft + 's linear';
      sunEl.style.bottom = '16%';
    });
    meterEl.style.transition = 'width .5s linear';
    meterEl.style.width = (100 * pct) + '%';
    roundTimer = setInterval(() => {
      if (partyActive) return;
      const elapsed = (performance.now() - t0) / 1000;
      timeLeft = Math.max(0, (remaining == null ? ROUND_SECS : remaining) - elapsed);
      meterEl.style.width = (timeLeft / ROUND_SECS) * 100 + '%';
      if (timeLeft <= 0) endRound();
    }, 200);
  }
  function endRound() {
    if (!roundActive) return;
    roundActive = false;
    if (roundTimer) { clearInterval(roundTimer); roundTimer = null; }
    if (heronTimeout) { clearTimeout(heronTimeout); heronTimeout = null; }
    if (partyTimer) { clearInterval(partyTimer); partyTimer = null; partyActive = false; }
    heronEl.classList.remove('on'); heronWarn.classList.remove('on'); heronActive = false;
    // clear prey
    for (const p of [...preyMap.values()]) despawn(p);
    scene.classList.add('night');
    // score
    if (catches > best) { best = catches; try { localStorage.setItem('gumbo-sunset-best', best); } catch (_) {} }
    hudBest.textContent = best;
    finalScore.textContent = catches;
    finalBest.textContent = best > 0 ? 'best: ' + best : '';
    // goodnight: he waves then settles
    clearTimers(); clearPendingEmote();
    state = 'EMOTE'; setMood();
    oneShot(WAVE, () => { if (state === 'EMOTE') { state = 'IDLE'; setMood(); swap(IDLE, true); } });
    setTimeout(() => roundEnd.classList.add('on'), 1200);
  }

  // ---------- the heron ----------
  function scheduleHeron(delay) {
    if (!roundActive) return;
    heronTimeout = setTimeout(() => {
      if (!roundActive) return;
      heronVisit();
    }, delay);
  }
  function heronVisit() {
    if (!roundActive) return;
    heronActive = true;
    heronWarn.classList.add('on');
    // warn, then fly
    setTimeout(() => {
      if (!roundActive || partyActive) { heronActive = false; heronWarn.classList.remove('on'); return; }
      heronWarn.classList.remove('on');
      heronEl.classList.remove('on');
      void heronEl.offsetWidth; // restart animation
      heronEl.classList.add('on');
      // during flight, check overlap
      const iv = setInterval(() => {
        if (!heronActive || partyActive) { clearInterval(iv); return; }
        const rect = heronEl.getBoundingClientRect();
        const hx = rect.left + rect.width / 2;
        const cx = petX + petEl.offsetWidth / 2;
        if (Math.abs(hx - cx) < 90 && !isBehind()) {
          clearInterval(iv);
          heronScare();
        }
      }, 50);
      setTimeout(() => {
        clearInterval(iv);
        heronActive = false;
        heronEl.classList.remove('on');
        if (roundActive && !partyActive) scheduleHeron(15000 + Math.random() * 12000);
      }, 3400);
    }, 2600);
  }
  function heronScare() {
    if (!roundActive) return;
    heronActive = false;
    const dropped = Math.min(3, catches);
    catches -= dropped;
    hudCaught.textContent = catches;
    startle();
    toast(dropped > 0 ? 'the heron took ' + dropped + '!' : 'the heron missed!');
    // scatter prey
    for (const p of preyMap.values()) { if (p.alive) p.x += (Math.random() < 0.5 ? 1 : -1) * 120; }
    // quick reshuffle, then next heron later
    setTimeout(() => { if (roundActive) scheduleHeron(15000 + Math.random() * 12000); }, 3000);
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.remove('on');
    void toastEl.offsetWidth;
    toastEl.classList.add('on');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('on'), 1100);
  }

  // ---------- game loop (prey drift) ----------
  function gameLoop(now) {
    requestAnimationFrame(gameLoop);
    if (!roundActive || partyActive) return;
    const dt = 16 / 1000;
    for (const p of preyMap.values()) {
      if (!p.alive) continue;
      p.phase += p.bobSpeed * dt;
      const wob = Math.sin(p.phase) * p.bobAmp;
      p.x += p.speed * dt;
      if (p.x < MARGIN) { p.x = MARGIN; p.speed = Math.abs(p.speed); }
      if (p.x > stageW - MARGIN) { p.x = stageW - MARGIN; p.speed = -Math.abs(p.speed); }
      p.el.style.left = p.x + 'px';
      p.el.style.bottom = (p.y + wob) + 'px';
    }
  }
  requestAnimationFrame(gameLoop);

  // ---------- boot ----------
  async function boot() {
    try {
      await Promise.all(PRELOAD.map(async (n) => {
        cache[n] = await (await fetch(json(n))).json();
      }));
    } catch (err) {
      bootEl.querySelector('.sub').textContent = 'could not reach the sandbox (needs the server)';
      bootEl.querySelector('.spinner').style.display = 'none';
      return;
    }
    petX = stageW * 0.16;
    petEl.classList.add('big');
    place(petX, true);
    bootEl.classList.add('hidden');
    idle();
    // start the hunt
    setTimeout(() => { startRound(); }, 1400);
  }

  function startRound() {
    roundActive = true;
    catches = 0;
    nextPartyAt = 10;
    hudCaught.textContent = '0';
    scene.classList.remove('night');
    roundEnd.classList.remove('on');
    for (let i = 0; i < PREY_KEEP; i++) spawnPrey();
    startRoundClock();
    scheduleHeron(12000 + Math.random() * 4000);
  }

  document.getElementById('btn-again').addEventListener('click', startRound);
  boot();
})();
</script>
</body>
</html>
