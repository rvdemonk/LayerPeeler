<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gumbo — a living pet, born from one image</title>
<style>
  :root {
    --ink: #f4e7d6;
    --ink-dim: #cbb89d;
    --ink-faint: rgba(244,231,214,.55);
    --accent: #ffb56b;
    --accent-soft: rgba(255,181,107,.18);
    --frog: #7fb2e8;
    --frog-deep: #5a8fd0;
    --ui-bg: rgba(22,16,41,.55);
    --ui-border: rgba(244,231,214,.14);
    --waterline: 30%;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    color: var(--ink);
    overflow: hidden;
    background: #161029;
    user-select: none;
  }

  /* ---------- the scene ---------- */
  .scene {
    position: fixed; inset: 0;
    overflow: hidden;
    background:
      radial-gradient(130% 90% at 50% 66%, rgba(255,140,90,.34), transparent 58%),
      radial-gradient(60% 50% at 78% 14%, rgba(255,214,150,.12), transparent 60%),
      linear-gradient(180deg,
        #141020 0%, #241542 30%, #442262 48%, #7a3a5c 62%,
        #c45a4c 68%, #ee8f4e 72%, #f3b065 74%,
        #1d2c4d 74%, #131f3a 100%);
  }
  .moon {
    position: absolute; top: 9%; right: 12%;
    width: 88px; height: 88px; border-radius: 50%;
    background: radial-gradient(circle at 38% 36%, #fff3da, #ffdfa8 60%, #ffc97d);
    box-shadow: 0 0 60px 18px rgba(255,223,168,.35);
    opacity: .92;
  }

  /* drifting fireflies */
  .firefly {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #ffe9b0;
    box-shadow: 0 0 8px 3px rgba(255,233,176,.5);
    opacity: 0;
    animation: drift 14s ease-in-out infinite;
  }
  @keyframes drift {
    0%   { opacity: 0; transform: translate(0,0) }
    8%   { opacity: .9 }
    30%  { transform: translate(40px,-28px) }
    50%  { transform: translate(-26px,-52px) }
    72%  { transform: translate(24px,-18px) }
    88%  { opacity: .7 }
    100% { opacity: 0; transform: translate(0,0) }
  }

  /* water */
  .water {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--waterline);
    background: linear-gradient(180deg, rgba(16,30,58,.55), rgba(9,18,38,.9));
    backdrop-filter: blur(1px);
    overflow: hidden;
  }
  .water::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg,
      transparent 0 60px, rgba(240,190,120,.06) 60px 62px,
      transparent 62px 130px, rgba(240,190,120,.05) 130px 131px);
    animation: shimmer 9s linear infinite;
  }
  @keyframes shimmer { from { transform: translateX(-130px) } to { transform: translateX(130px) } }
  .waterline-glow {
    position: absolute; left: 0; right: 0; bottom: var(--waterline);
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,190,120,.7), transparent);
    box-shadow: 0 0 14px 2px rgba(255,190,120,.4);
  }

  /* distant silhouettes */
  .hills {
    position: absolute; left: 0; right: 0; bottom: var(--waterline);
    height: 42%; opacity: .5;
  }
  .hills svg { width: 100%; height: 100%; display: block; }

  /* lily pads & pebbles on the water (behind the frog) */
  .mid { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .lily {
    position: absolute;
    width: 64px; height: 26px;
    background: radial-gradient(ellipse at 30% 40%, #3c5a46, #24392e 75%);
    border-radius: 50%;
    box-shadow: inset 0 4px 8px rgba(255,255,255,.06), 0 4px 10px rgba(0,0,0,.35);
  }
  .lily::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 8px; height: 8px; transform: translate(-50%,-50%);
    background: #1b2a21; border-radius: 50%; opacity: .7;
  }
  .pebble {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #6b5a78, #3a2f4a 78%);
    box-shadow: 0 3px 8px rgba(0,0,0,.4);
  }

  /* foreground reed — the frog walks BEHIND this, proving true compositing */
  .reed {
    position: absolute; z-index: 5; pointer-events: none;
    bottom: calc(var(--waterline) - 6px);
    left: 64%;
    transform: translateX(-50%);
    width: 220px; height: 380px;
    filter: drop-shadow(0 0 6px rgba(0,0,0,.4));
  }
  .reed svg { width: 100%; height: 100%; display: block; }

  /* ---------- the pet ---------- */
  .pet {
    position: absolute; z-index: 6;
    width: 150px; height: 150px;
    left: 0; bottom: calc(var(--waterline) + 6px);
    transition: none;
    will-change: transform, left;
  }
  .pet.behind { z-index: 3; }  /* walks behind the reed — true compositing */
  .pet.big { width: 190px; height: 190px; }
  .shadow {
    position: absolute; left: 50%; bottom: -18px;
    width: 96px; height: 20px; transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0,0,0,.42), transparent 68%);
    border-radius: 50%;
    transition: width .3s, opacity .3s;
  }
  .pet.dragging .shadow { width: 70px; opacity: .55; }
  .alive-pulse {
    position: absolute; left: 50%; top: 50%;
    width: 120px; height: 120px; transform: translate(-50%,-50%);
    border: 2px solid var(--accent);
    border-radius: 50%; opacity: 0; pointer-events: none;
  }
  .pet.pulse .alive-pulse { animation: pulse 1.1s ease-out; }
  @keyframes pulse {
    0% { opacity: .7; transform: translate(-50%,-50%) scale(.6) }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.5) }
  }
  #frog { position: absolute; inset: 0; }
  #frog .layer { position: absolute; inset: 0; }
  #frog .layer.on { z-index: 2; }
  #frog .layer.off { z-index: 1; }

  /* ---------- chrome / ui ---------- */
  .wordmark {
    position: fixed; top: 22px; left: 26px; z-index: 20;
    pointer-events: none;
  }
  .wordmark h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-weight: 400; font-size: 34px; letter-spacing: .5px; line-height: 1;
    color: var(--ink);
    text-shadow: 0 2px 18px rgba(0,0,0,.45);
  }
  .wordmark .tag {
    margin-top: 6px; font-size: 11px; letter-spacing: 2.4px;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .wordmark .tag b { color: var(--accent); font-weight: 600; }

  .mood {
    position: fixed; top: 22px; right: 26px; z-index: 20;
    display: flex; align-items: center; gap: 9px;
    padding: 8px 14px;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    border-radius: 999px;
    font-size: 12.5px; letter-spacing: .4px; color: var(--ink);
    backdrop-filter: blur(8px);
  }
  .mood .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); animation: breathe-dot 2.2s ease-in-out infinite;
  }
  @keyframes breathe-dot { 0%,100% { opacity:.4; transform:scale(.85) } 50% { opacity:1; transform:scale(1.15) } }
  .mood span { color: var(--ink-faint); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }

  .hint {
    position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%);
    z-index: 20;
    font-size: 12px; color: var(--ink-faint); letter-spacing: .3px;
    text-align: center; white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,.5);
  }
  .hint b { color: var(--ink-dim); font-weight: 500; }

  .dock {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 20;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    justify-content: center;
    padding: 10px 14px;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    border-radius: 18px;
    backdrop-filter: blur(10px);
    max-width: calc(100vw - 40px);
  }
  .dock .label {
    font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--ink-faint); padding-right: 4px;
  }
  .chip {
    padding: 7px 13px; border-radius: 999px; cursor: pointer;
    font-size: 12.5px; color: var(--ink-dim); letter-spacing: .3px;
    border: 1px solid transparent; transition: all .15s;
    background: transparent;
  }
  .chip:hover { color: var(--ink); background: var(--accent-soft); }
  .chip.active { color: #2a1b12; background: var(--accent); font-weight: 600; }
  .chip.startle { color: var(--accent); border-color: rgba(255,181,107,.4); }
  .chip.startle:hover { background: var(--accent-soft); }

  .beatsheet {
    position: fixed; bottom: 108px; right: 26px; z-index: 20;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10.5px; line-height: 1.7; color: var(--ink-faint);
    text-align: right; pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,.5);
  }
  .beatsheet b { color: var(--ink-dim); font-weight: 400; }

  .boot {
    position: fixed; inset: 0; z-index: 40;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: #161029;
    transition: opacity .7s;
  }
  .boot.hidden { opacity: 0; pointer-events: none; }
  .boot .title {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 40px; color: var(--ink); letter-spacing: .5px;
  }
  .boot .sub { font-size: 12px; color: var(--ink-faint); letter-spacing: 2px; text-transform: uppercase; }
  .boot .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--ui-border); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }

  @media (max-width: 640px) {
    .wordmark h1 { font-size: 26px; }
    .pet { width: 110px; height: 110px; }
    .pet.big { width: 140px; height: 140px; }
    .hint { bottom: 92px; white-space: normal; width: 86vw; }
    .beatsheet { display: none; }
    .moon { width: 60px; height: 60px; }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="moon"></div>
  <div class="hills">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="#241538" d="M0,220 C160,120 260,260 420,180 C580,100 660,240 820,190 C1000,130 1080,230 1260,170 C1340,140 1400,150 1440,150 L1440,320 L0,320 Z"/>
      <path fill="#3a2450" d="M0,260 C140,200 300,280 480,230 C640,190 760,270 940,230 C1120,190 1260,270 1440,220 L1440,320 L0,320 Z"/>
    </svg>
  </div>

  <div class="mid">
    <div class="lily" style="left:12%; bottom:14%"></div>
    <div class="lily" style="left:38%; bottom:6%; transform:scale(.7)"></div>
    <div class="lily" style="right:18%; bottom:18%; transform:scale(.55)"></div>
    <div class="pebble" style="left:24%; bottom:4%; width:14px; height:11px"></div>
    <div class="pebble" style="right:30%; bottom:8%; width:10px; height:8px"></div>
  </div>

  <div class="reed">
    <svg viewBox="0 0 220 380" preserveAspectRatio="xMidYMax meet">
      <g fill="#1a1030">
        <path d="M104,378 Q118,250 96,120 L128,120 Q108,250 120,378 Z"/>
        <path d="M78,378 Q74,240 40,160 L66,150 Q84,250 92,378 Z"/>
        <path d="M148,378 Q156,230 196,150 L170,142 Q142,250 132,378 Z"/>
      </g>
      <g fill="#241542">
        <ellipse cx="106" cy="118" rx="16" ry="46" transform="rotate(8 106 118)"/>
        <ellipse cx="58" cy="158" rx="14" ry="38" transform="rotate(-24 58 158)"/>
        <ellipse cx="168" cy="148" rx="14" ry="40" transform="rotate(22 168 148)"/>
      </g>
    </svg>
  </div>

  <div class="waterline-glow"></div>
  <div class="water"></div>

  <div class="pet" id="pet">
    <div class="alive-pulse"></div>
    <div class="shadow"></div>
    <div id="frog">
      <div class="layer on" id="frog-a"></div>
      <div class="layer off" id="frog-b"></div>
    </div>
  </div>
</div>

<div class="wordmark">
  <h1>gumbo</h1>
  <div class="tag">the <b>living pet</b> &nbsp;·&nbsp; born from one image</div>
</div>

<div class="mood" id="mood"><div class="dot"></div><span id="moodword">waking up</span></div>

<div class="hint"><b>click</b> the water to walk &nbsp;·&nbsp; <b>drag</b> him &nbsp;·&nbsp; <b>double-click</b> to startle &nbsp;·&nbsp; <b>pet</b> him &nbsp;·&nbsp; hide the tab and come back</div>

<div class="dock">
  <span class="label">his move</span>
  <button class="chip active" data-emote="boogie">boogie</button>
  <button class="chip" data-emote="bop">bop</button>
  <button class="chip" data-emote="groove">groove</button>
  <button class="chip" data-emote="sway">sway</button>
  <button class="chip" data-emote="gasp">gasp</button>
  <button class="chip startle" id="btn-startle">startle</button>
</div>

<div class="beatsheet">
  <div>state: <b id="bs-state">booting</b></div>
  <div>anim: <b id="bs-anim">—</b></div>
  <div>rule: <b id="bs-rule">eyes never narrow to slits</b></div>
</div>

<div class="boot" id="boot">
  <div class="title">gumbo</div>
  <div class="sub">is waking up</div>
  <div class="spinner"></div>
</div>

<script src="/vendor/lottie.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------- animation registry ----------
  // Every clip: one image in, a living loop out. Same 512px canvas,
  // same 121 frames, chained by the engine below.
  const IDLE     = 'frog-idle-breathe';
  const SCAN     = 'frog-idle-scan';
  const WALK     = 'frog-walk';
  const SURPRISE = 'frog-surprise-pop';
  const GASP     = 'frog-surprise-gasp';
  const WAVE     = 'frog-wave-v8-aa-w125';
  const EMOTES   = {
    boogie: 'frog-boogie5',
    bop:    'frog-bop',
    groove: 'frog-groove',
    sway:   'frog-sway',
    gasp:   'frog-surprise-gasp',
  };
  const BASE = '/media/pipeline/';
  const json = (n) => BASE + n + '/ladder/' + n + '.512webp-q65-24.json';
  const PRELOAD = [IDLE, SCAN, WALK, SURPRISE, GASP, WAVE,
                   EMOTES.boogie, EMOTES.bop, EMOTES.groove, EMOTES.sway];

  // ---------- walk displacement (calibrated on the actual walk cycle) ----------
  // frame -> normalized displacement, precomputed once. Velocity profile:
  // idle 0-11, accelerate 12-26, cruise 27-99, decelerate 100-110, idle 111-121.
  const WS = 12, WC = 27, WL = 100, WD = 110, WMAX = 121;
  const vel = (f) =>
    f <= WS ? 0 :
    f < WC ? (f - WS) / (WC - WS) :
    f < WL ? 1 :
    f < WD ? (WD - f) / (WD - WL) : 0;
  let _tot = 0; for (let f = 0; f <= WMAX; f++) _tot += vel(f);
  const disp = new Float32Array(WMAX + 1);
  { let a = 0; for (let f = 0; f <= WMAX; f++) { a += vel(f); disp[f] = a / _tot; } }

  // ---------- dom ----------
  const scene   = document.getElementById('scene');
  const petEl   = document.getElementById('pet');
  const bootEl  = document.getElementById('boot');
  const moodEl  = document.getElementById('moodword');
  const bsState = document.getElementById('bs-state');
  const bsAnim  = document.getElementById('bs-anim');

  let stageW = window.innerWidth, stageH = window.innerHeight;
  const MARGIN = 70;

  // ---------- state ----------
  let anim = null;            // current lottie
  let cache = {};             // name -> json
  let state = 'BOOT';         // IDLE WALKING DRAGGING EMOTE AWAY
  let petX = 0;               // current left
  let facing = 1;
  let emotePick = 'boogie';
  let idleTimer = null, emoteTimer = null;
  let away = false;
  const MOODS = {
    BOOT: 'waking up', IDLE: 'content', WALKING: 'on his way',
    DRAGGING: 'wheee', EMOTE: 'performing', AWAY: 'waving you back',
  };

  const $idleTimeout = 6500;
  const $arriveTimeout = 6000;

  function setMood() {
    moodEl.textContent = MOODS[state] || state.toLowerCase();
    bsState.textContent = state.toLowerCase();
  }
  function setAnimName(n) { bsAnim.textContent = n || '—'; }

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const clearTimers = () => { clearTimeout(idleTimer); clearTimeout(emoteTimer); idleTimer = emoteTimer = null; };

  // ---------- lottie control (flicker-free cover-swap) ----------
  // Two stacked canvases (#frog-a on top, #frog-b behind). A new animation
  // loads into the BEHIND layer and paints its first frame while the old
  // one still shows on top; only then do we destroy the old and flip the
  // layers. The old frame is never removed before the new one is drawn, so
  // there is no blank gap. (Verified against lottie-web: on data complete
  // it runs gotoFrame() — first frame painted — then fires DOMLoaded.)
  let anim = null, pendingAnim = null, activeLayer = 'a';
  const frogA = document.getElementById('frog-a');
  const frogB = document.getElementById('frog-b');
  const layerOn = (l) => { l.classList.remove('off'); l.classList.add('on'); };
  const layerOff = (l) => { l.classList.remove('on'); l.classList.add('off'); };

  function swap(src, loop, onReady) {
    const data = cache[src];
    if (!data) return;
    // a swap already mid-flight into the behind layer: supersede it.
    if (pendingAnim) { try { pendingAnim.destroy(); } catch (_) {} pendingAnim = null; }

    const back = activeLayer === 'a' ? frogB : frogA;
    let a;
    try {
      a = lottie.loadAnimation({
        container: back, renderer: 'canvas',
        loop: !!loop, autoplay: false, animationData: data,
        rendererSettings: { preserveAspectRatio: 'xMidYMid meet' },
      });
    } catch (err) {
      setAnimName('(load failed)');
      return;
    }
    pendingAnim = a;
    a.addEventListener('DOMLoaded', () => {
      if (pendingAnim !== a) { try { a.destroy(); } catch (_) {} return; } // superseded
      pendingAnim = null;
      // first frame is painted behind — now the swap is gap-free.
      const front = activeLayer === 'a' ? frogA : frogB;
      if (anim) { try { anim.destroy(); } catch (_) {} }
      anim = a;
      layerOff(front); layerOn(back);
      activeLayer = activeLayer === 'a' ? 'b' : 'a';
      setAnimName(src);
      if (onReady) onReady(a);
      else a.play();
    });
  }
  function oneShot(src, then) {
    swap(src, false, (a) => {
      const off = a.addEventListener('complete', () => {
        off();
        if (then) then();
      });
      a.play();
    });
  }

  // ---------- occlusion: the frog walks BEHIND the reed ----------
  const REED_CX = 0.64;                 // matches .reed left
  const REED_W = 130;
  function updateOcclusion() {
    const cx = petX + petEl.offsetWidth / 2;
    const reedLeft = stageW * REED_CX - REED_W / 2;
    const reedRight = stageW * REED_CX + REED_W / 2;
    petEl.classList.toggle('behind', cx > reedLeft && cx < reedRight);
  }
  const occlude = () => updateOcclusion;

  function place(x, noFlip) {
    petX = clamp(x, MARGIN, stageW - MARGIN);
    petEl.style.left = petX + 'px';
    if (!noFlip) facing = 1;
    petEl.style.transform = 'scaleX(' + facing + ')';
    updateOcclusion();
  }

  // ---------- idle behaviour (the frog lives whether you click or not) ----------
  function idle() {
    state = 'IDLE'; setMood(); clearTimers();
    petEl.classList.remove('dragging', 'pulse');
    petEl.style.transform = 'scaleX(' + facing + ')';
    swap(IDLE, true);
    scheduleIdleLife();
  }
  function scheduleIdleLife() {
    clearTimeout(idleTimer);
    // every few seconds he does something on his own: a curious scan.
    idleTimer = setTimeout(() => {
      if (state !== 'IDLE' || away) return;
      state = 'SCAN'; setMood();
      oneShot(SCAN, () => { if (state === 'SCAN') idle(); });
      scheduleIdleLife();
    }, 7000 + Math.random() * 6000);
  }

  // ---------- walk to a point ----------
  function walkTo(targetX) {
    if (cache[WALK] === undefined) return;
    clearTimers();
    const fromX = petX;
    let dist = targetX - fromX;
    if (Math.abs(dist) < 26) { arrival(); return; }
    const target = clamp(targetX, MARGIN, stageW - MARGIN);
    dist = target - fromX;
    facing = dist > 0 ? 1 : -1;
    state = 'WALKING'; setMood();
    petEl.classList.remove('dragging');
    petEl.style.transform = 'scaleX(' + facing + ')';
    const travel = Math.abs(dist);
    swap(WALK, false, (a) => {
      a.addEventListener('enterFrame', () => {
        const f = clamp(Math.round(a.currentFrame), 0, WMAX);
        const p = disp[f];
        petX = fromX + facing * p * travel;
        petEl.style.left = petX + 'px';
        updateOcclusion();
      });
      a.addEventListener('complete', () => { place(target, true); arrival(); });
      a.play();
    });
  }

  function arrival() {
    state = 'EMOTE'; setMood();
    petEl.classList.add('pulse'); setTimeout(() => petEl.classList.remove('pulse'), 1200);
    const src = EMOTES[emotePick] || EMOTES.boogie;
    swap(src, true);
    clearTimeout(emoteTimer);
    emoteTimer = setTimeout(() => { if (state === 'EMOTE') idle(); }, $arriveTimeout);
  }

  // ---------- surprise + gasp ----------
  function startle() {
    clearTimers();
    state = 'EMOTE'; setMood();
    petEl.classList.add('pulse'); setTimeout(() => petEl.classList.remove('pulse'), 1200);
    oneShot(SURPRISE, () => { if (state === 'EMOTE') idle(); });
  }
  function petHim() {
    clearTimers();
    state = 'EMOTE'; setMood();
    oneShot(GASP, () => { if (state === 'EMOTE') idle(); });
  }

  // ---------- drag + tap + double-tap (all start on the pet) ----------
  let dragMode = false;
  let dragLast = { x: 0, t: 0 }, dragFar = false, dragFast = false;
  let tapTimer = null, tapArmed = false;

  function beginPetGesture(e) {
    if (cache[IDLE] === undefined) return;
    if (tapArmed) {
      // second tap inside the window = double-tap = startle
      clearTimeout(tapTimer); tapArmed = false;
      startle();
      return;
    }
    tapArmed = true;
    tapTimer = setTimeout(() => { tapArmed = false; }, 320);

    // could be a tap (pet) or a drag (move him) — wait to decide.
    dragMode = false;
    dragFar = false; dragFast = false;
    dragLast = { x: e.clientX, t: performance.now() };
    document.addEventListener('pointermove', onPetMove);
    document.addEventListener('pointerup', onPetUp, { once: true });
  }

  function onPetMove(e) {
    const dx = e.clientX - dragLast.x;
    if (!dragMode && Math.abs(dx) > 6) {
      dragMode = true;
      clearTimers();
      state = 'DRAGGING'; setMood();
      petEl.classList.add('dragging');
      swap(IDLE, true);
    }
    if (!dragMode) return;
    const now = performance.now();
    const dt = now - dragLast.t;
    if (dt > 0 && Math.abs(dx) / dt > 0.55) dragFast = true;
    if (Math.abs(dx) > 14) dragFar = true;
    dragLast = { x: e.clientX, t: now };
    facing = dx < 0 ? -1 : 1;
    place(e.clientX, true);
    // wobble while held
    const t = now / 1000;
    const tilt = Math.sin(t * 7) * 3.2;
    const squash = 1 + Math.sin(t * 11) * 0.05;
    petEl.style.transform = 'scaleX(' + facing + ') rotate(' + tilt + 'deg) scale(' + (1 / squash) + ',' + squash + ')';
    updateOcclusion();
  }

  function onPetUp() {
    document.removeEventListener('pointermove', onPetMove);
    clearTimeout(tapTimer);
    if (dragMode) {
      tapArmed = false;
      petEl.classList.remove('dragging');
      petEl.style.transform = 'scaleX(' + facing + ')';
      if (dragFast && dragFar) { startle(); }
      else { idle(); }
    } else {
      // a tap — but wait out the double-tap window before petting, so a
      // double-click can't also trigger the gasp.
      tapTimer = setTimeout(() => { tapArmed = false; petHim(); }, 320);
    }
  }

  // ---------- scene interaction ----------
  scene.addEventListener('pointerdown', (e) => {
    if (cache[IDLE] === undefined) return;
    const rect = petEl.getBoundingClientRect();
    const onPet = e.clientX >= rect.left && e.clientX <= rect.right &&
                  e.clientY >= rect.top && e.clientY <= rect.bottom;
    if (onPet) { beginPetGesture(e); return; }
    // clicked the water: walk there
    walkTo(e.clientX - petEl.offsetWidth / 2);
  });

  // ---------- emote picker: set the arrival default AND perform now ----------
  document.querySelectorAll('.chip[data-emote]').forEach((c) => {
    c.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-emote]').forEach((x) => x.classList.remove('active'));
      c.classList.add('active');
      emotePick = c.dataset.emote;
      // performing it now is what "activate" means — he does the move, then
      // the same move becomes his arrival dance until you pick another.
      if (state !== 'WALKING' && state !== 'DRAGGING' && !away) {
        clearTimers();
        arrival();
      }
    });
  });
  document.getElementById('btn-startle').addEventListener('click', startle);

  // ---------- attention: wave while away, surprise on return ----------
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      away = true; clearTimers();
      state = 'AWAY'; setMood();
      petEl.classList.remove('dragging');
      petEl.style.transform = 'scaleX(' + facing + ')';
      swap(WAVE, true);
    } else if (away) {
      away = false;
      startle();   // he's surprised to see you back
    }
  });

  // ---------- resize ----------
  window.addEventListener('resize', () => {
    stageW = window.innerWidth; stageH = window.innerHeight;
    place(petX, true); updateOcclusion();
  });

  // ---------- boot ----------
  async function boot() {
    try {
      await Promise.all(PRELOAD.map(async (n) => {
        cache[n] = await (await fetch(json(n))).json();
      }));
    } catch (err) {
      bootEl.querySelector('.sub').textContent = 'could not reach the sandbox (needs the server)';
      bootEl.querySelector('.spinner').style.display = 'none';
      return;
    }
    // start position: left of the reed, at home
    petX = stageW * 0.16;
    petEl.classList.add('big');
    place(petX, true);
    bootEl.classList.add('hidden');
    idle();
    // he scans once as an intro before settling into content
    setTimeout(() => { if (state === 'IDLE') oneShot(SCAN, () => { if (state === 'IDLE') idle(); }); }, 900);
  }
  boot();
})();
</script>
</body>
</html>
